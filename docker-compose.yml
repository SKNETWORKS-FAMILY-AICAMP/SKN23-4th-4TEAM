
services:
  db:
    image: postgres:16
    container_name: yoto_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-youonlytalkonce}
      POSTGRES_USER: ${POSTGRES_USER:-youonlytalkonce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-youonlytalkonce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-youonlytalkonce} -d ${POSTGRES_DB:-youonlytalkonce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    build:
      context: .
      dockerfile: services/fastapi_ai/Dockerfile
    container_name: yoto_fastapi
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  django:
    build:
      context: .
      dockerfile: services/django_web/Dockerfile
    container_name: yoto_django
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_USE_X_FORWARDED_HOST: ${DJANGO_USE_X_FORWARDED_HOST:-true}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-false}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-false}
      DJANGO_CSRF_COOKIE_HTTPONLY: ${DJANGO_CSRF_COOKIE_HTTPONLY:-true}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-youonlytalkonce}
      POSTGRES_USER: ${POSTGRES_USER:-youonlytalkonce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-youonlytalkonce}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      FASTAPI_BASE_URL: http://fastapi:8001
    depends_on:
      db:
        condition: service_healthy
      fastapi:
        condition: service_started
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: yoto_nginx
    depends_on:
      django:
        condition: service_started
      fastapi:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/staticfiles:/var/www/static:ro

volumes:
  postgres_data:
